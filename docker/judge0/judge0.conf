################################################################################
# Judge0 — minimal config for Evolv local stack
################################################################################

REDIS_HOST=judge0-redis
REDIS_PORT=6379
REDIS_PASSWORD=judge0_redis_secret

POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0_secret

# Sandbox limits (seconds / KB)
CPU_TIME_LIMIT=5
WALL_TIME_LIMIT=10
MEMORY_LIMIT=128000
MAX_FILE_SIZE=1024

# Disable network in sandbox by default
ENABLE_NETWORK=false
