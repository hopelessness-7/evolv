# =============================================================================
# Evolv — образец docker-compose
# Скопируй в корень: cp docker-compose.example.yml docker-compose.yml
# Редактируй по шагам из docs/bootstrap/02-infra-compose.md
# =============================================================================

name: evolv

services:
  # ---------------------------------------------------------------------------
  # Шаг 2a: подними сначала только postgres, redis, ollama
  # ---------------------------------------------------------------------------

  postgres:
    image: pgvector/pgvector:pg16
    container_name: evolv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evolv}
      POSTGRES_USER: ${POSTGRES_USER:-evolv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - evolv_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evolv} -d ${POSTGRES_DB:-evolv}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: evolv-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - evolv_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: evolv-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - evolv_internal
    # Раскомментируй, если нужен доступ с хоста без docker exec:
    # ports:
    #   - "11434:11434"

  # ---------------------------------------------------------------------------
  # Шаг 2b: nginx (после того как postgres/redis/ollama healthy)
  # ---------------------------------------------------------------------------

  nginx:
    image: nginx:1.27-alpine
    container_name: evolv-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - evolv_public
      - evolv_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ---------------------------------------------------------------------------
  # Этап 3+: core (Laravel) — раскомментируй, когда будет Dockerfile
  # ---------------------------------------------------------------------------

  # core:
  #   build:
  #     context: ./services/core
  #     dockerfile: Dockerfile
  #   container_name: evolv-core
  #   restart: unless-stopped
  #   env_file: .env
  #   environment:
  #     DB_HOST: postgres
  #     REDIS_HOST: redis
  #   networks:
  #     - evolv_internal
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

  # ---------------------------------------------------------------------------
  # Этап 4+: gateway (NestJS)
  # ---------------------------------------------------------------------------

  # gateway:
  #   build:
  #     context: ./services/gateway
  #     dockerfile: Dockerfile
  #   container_name: evolv-gateway
  #   restart: unless-stopped
  #   env_file: .env
  #   environment:
  #     DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  #     CORE_INTERNAL_URL: http://core:9000
  #   networks:
  #     - evolv_public
  #     - evolv_internal
  #   depends_on:
  #     - postgres
  #     - redis

  # ---------------------------------------------------------------------------
  # Этап 5+: llm-worker, practice-runner
  # ---------------------------------------------------------------------------

  # llm-worker:
  #   build: ./services/llm-worker
  #   ...

  # practice-runner:
  #   build: ./services/practice-runner
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   ...

networks:
  evolv_internal:
    driver: bridge
  evolv_public:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ollama_data:
